<svg xmlns="http://www.w3.org/2000/svg" width="1220" height="817"><defs><marker id="a" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0 0 L6 3 L0 6" fill="none" stroke="#6a8b7c"/></marker></defs><rect width="100%" height="100%" fill="#f7f5ed"/><g font-family="Microsoft YaHei,sans-serif"><text x="36" y="49" font-size="30" font-weight="700" fill="#2a4139">玩法流程｜检查、提出方案、实际施工</text><text x="36" y="85" font-size="19" font-weight="400" fill="#2a4139">人物同意、技术判断和资源结算分别处理。</text><rect x="36" y="119" width="300" height="112" rx="10" fill="#fff" stroke="#c7cec6"/><text x="52" y="153" font-size="22" font-weight="700" fill="#2a4139">接待与查看</text><text x="52" y="187" font-size="18" font-weight="400" fill="#2a4139">物件症状、顾客用途</text><text x="52" y="219" font-size="18" font-weight="400" fill="#2a4139">回看记录不消耗资源</text><rect x="386" y="119" width="350" height="112" rx="10" fill="#fff" stroke="#c7cec6"/><text x="402" y="153" font-size="22" font-weight="700" fill="#2a4139">检查与诊断</text><text x="402" y="187" font-size="18" font-weight="400" fill="#2a4139">测试后提交故障判断</text><text x="402" y="219" font-size="18" font-weight="400" fill="#2a4139">不符时指出冲突现象</text><rect x="786" y="119" width="396" height="112" rx="10" fill="#fff" stroke="#c7cec6"/><text x="802" y="153" font-size="22" font-weight="700" fill="#2a4139">提出修补方案</text><text x="802" y="187" font-size="18" font-weight="400" fill="#2a4139">对照保留与失去的功能</text><text x="802" y="219" font-size="18" font-weight="400" fill="#2a4139">顾客说明接受条件或拒绝原因</text><path d="M336 175 L382 175" fill="none" stroke="#6a8b7c" stroke-width="3" marker-end="url(#a)"/><path d="M736 175 L782 175" fill="none" stroke="#6a8b7c" stroke-width="3" marker-end="url(#a)"/><rect x="786" y="299" width="396" height="112" rx="10" fill="#fff" stroke="#c7cec6"/><text x="802" y="333" font-size="22" font-weight="700" fill="#2a4139">接受且资源足够？</text><text x="802" y="367" font-size="18" font-weight="400" fill="#2a4139">未同意：继续协商或换方案</text><text x="802" y="399" font-size="18" font-weight="400" fill="#2a4139">不足：显示缺少的资源</text><path d="M984 231 L984 295" fill="none" stroke="#6a8b7c" stroke-width="3" marker-end="url(#a)"/><rect x="386" y="299" width="350" height="112" rx="10" fill="#fff" stroke="#c7cec6"/><text x="402" y="333" font-size="22" font-weight="700" fill="#2a4139">确认施工</text><text x="402" y="367" font-size="18" font-weight="400" fill="#2a4139">一次扣除工作格与模块</text><text x="402" y="399" font-size="18" font-weight="400" fill="#2a4139">更新物件、委托与回应</text><path d="M786 355 L740 355" fill="none" stroke="#6a8b7c" stroke-width="3" marker-end="url(#a)"/><text x="746" y="339" font-size="17" font-weight="400" fill="#2a4139">是</text><rect x="36" y="299" width="300" height="112" rx="10" fill="#fff" stroke="#c7cec6"/><text x="52" y="333" font-size="22" font-weight="700" fill="#2a4139">处理本段其他委托</text><text x="52" y="367" font-size="18" font-weight="400" fill="#2a4139">共享资源即时更新</text><text x="52" y="399" font-size="18" font-weight="400" fill="#2a4139">未处理用途继续显示</text><path d="M386 355 L340 355" fill="none" stroke="#6a8b7c" stroke-width="3" marker-end="url(#a)"/><path d="M180 299 V235" stroke="#6a8b7c" stroke-width="3" marker-end="url(#a)"/><rect x="36" y="488" width="300" height="112" rx="10" fill="#fff" stroke="#c7cec6"/><text x="52" y="522" font-size="22" font-weight="700" fill="#2a4139">结束当前段落</text><text x="52" y="556" font-size="18" font-weight="400" fill="#2a4139">教学段完成后继续</text><text x="52" y="588" font-size="18" font-weight="400" fill="#2a4139">最后一段确认未处理项</text><path d="M180 411 L180 484" fill="none" stroke="#6a8b7c" stroke-width="3" marker-end="url(#a)"/><rect x="386" y="488" width="350" height="112" rx="10" fill="#fff" stroke="#c7cec6"/><text x="402" y="522" font-size="22" font-weight="700" fill="#2a4139">进入下一段或回访</text><text x="402" y="556" font-size="18" font-weight="400" fill="#2a4139">前段已发生的事继续保留</text><text x="402" y="588" font-size="18" font-weight="400" fill="#2a4139">按物件和委托结果显示回应</text><path d="M336 544 L382 544" fill="none" stroke="#6a8b7c" stroke-width="3" marker-end="url(#a)"/><rect x="786" y="488" width="396" height="154" rx="10" fill="#eee7d6" stroke="#c7cec6"/><text x="804" y="522" font-size="22" font-weight="700" fill="#2a4139">最终段：授权转用支路</text><text x="804" y="557" font-size="18" font-weight="400" fill="#2a4139">先询问主人并说明功能损失</text><text x="804" y="589" font-size="18" font-weight="400" fill="#2a4139">同意后消耗 1 格，得到 1 块模块</text><text x="804" y="621" font-size="18" font-weight="400" fill="#2a4139">来源设备变为耳机输出，限一次</text><rect x="36" y="673" width="1146" height="107" rx="10" fill="#dce7dd" stroke="#c7cec6"/><text x="55" y="708" font-size="22" font-weight="700" fill="#2a4139">重新安排：恢复最后一段开始时的全部状态</text><text x="55" y="745" font-size="20" font-weight="400" fill="#2a4139">资源、委托、物件、同意与转用记录一起恢复；配置保持只读。</text></g></svg>