<svg xmlns="http://www.w3.org/2000/svg" width="1180" height="830" viewBox="0 0 1180 830"><defs><marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6" fill="none" stroke="#66887c" stroke-width="1.4"/></marker></defs><rect width="100%" height="100%" fill="#f6f4ed"/><g font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif"><text x="40" y="53" font-size="30" fill="#263c38" font-weight="700">玩法流程｜标准版与恢复边界</text><text x="40" y="88" font-size="19" fill="#263c38" font-weight="400">所有结算由唯一经营状态处理；界面只提交操作并显示结果。</text><rect x="40" y="120" width="260" height="110" rx="12" fill="#ffffff" stroke="#d7d8d0"/><text x="60" y="156" font-size="23" fill="#263c38" font-weight="700">开局／下一回合</text><text x="60" y="189" font-size="18" fill="#50645e" font-weight="400">读取配置，补充一次基础供给</text><text x="60" y="215" font-size="18" fill="#50645e" font-weight="400">建立本回合起点快照</text><rect x="359" y="120" width="300" height="110" rx="12" fill="#ffffff" stroke="#d7d8d0"/><text x="379" y="156" font-size="23" fill="#263c38" font-weight="700">查看订单与物件</text><text x="379" y="189" font-size="18" fill="#50645e" font-weight="400">两单需求、报酬、费用可查</text><text x="379" y="215" font-size="18" fill="#50645e" font-weight="400">阅读不扣资源</text><rect x="720" y="120" width="420" height="110" rx="12" fill="#ffffff" stroke="#d7d8d0"/><text x="740" y="156" font-size="23" fill="#263c38" font-weight="700">选择零件／槽位预览</text><text x="740" y="189" font-size="18" fill="#50645e" font-weight="400">可换件、取消；暂不扣库存</text><text x="740" y="215" font-size="18" fill="#50645e" font-weight="400">类型与数量不足时说明具体原因</text><path d="M300,175 L355,175" fill="none" stroke="#66887c" stroke-width="3" marker-end="url(#arr)"/><path d="M659,175 L716,175" fill="none" stroke="#66887c" stroke-width="3" marker-end="url(#arr)"/><rect x="720" y="290" width="420" height="110" rx="12" fill="#ffffff" stroke="#d7d8d0"/><text x="740" y="326" font-size="23" fill="#263c38" font-weight="700">确认交付</text><text x="740" y="359" font-size="18" fill="#50645e" font-weight="400">有效：扣零件、收款、记录完成</text><text x="740" y="385" font-size="18" fill="#50645e" font-weight="400">无效：保留当前状态并显示原因</text><path d="M930,230 L930,286" fill="none" stroke="#66887c" stroke-width="3" marker-end="url(#arr)"/><rect x="359" y="290" width="300" height="110" rx="12" fill="#ffffff" stroke="#d7d8d0"/><text x="379" y="326" font-size="23" fill="#263c38" font-weight="700">继续处理当前回合</text><text x="379" y="359" font-size="18" fill="#50645e" font-weight="400">另一单／采购／拆取／打烊</text><text x="379" y="385" font-size="18" fill="#50645e" font-weight="400">已交付订单不可再次收款</text><path d="M720,345 L663,345" fill="none" stroke="#66887c" stroke-width="3" marker-end="url(#arr)"/><path d="M509,290 L509,234" stroke="#66887c" stroke-width="3" fill="none" marker-end="url(#arr)"/><rect x="40" y="290" width="260" height="110" rx="12" fill="#ffffff" stroke="#d7d8d0"/><text x="60" y="326" font-size="23" fill="#263c38" font-weight="700">采购与拆取</text><text x="60" y="359" font-size="18" fill="#50645e" font-weight="400">先告知价格或不可逆后果</text><text x="60" y="385" font-size="18" fill="#50645e" font-weight="400">确认后才改变真实状态</text><path d="M300,345 L355,345" fill="none" stroke="#66887c" stroke-width="3" marker-end="url(#arr)"/><rect x="359" y="467" width="300" height="110" rx="12" fill="#ffffff" stroke="#d7d8d0"/><text x="379" y="503" font-size="23" fill="#263c38" font-weight="700">确认打烊并扣费</text><text x="379" y="536" font-size="18" fill="#50645e" font-weight="400">未处理订单提示，费用扣一次</text><text x="379" y="562" font-size="18" fill="#50645e" font-weight="400">现金 ≥0 可继续</text><path d="M509,400 L509,463" fill="none" stroke="#66887c" stroke-width="3" marker-end="url(#arr)"/><rect x="720" y="467" width="420" height="110" rx="12" fill="#ffffff" stroke="#d7d8d0"/><text x="740" y="503" font-size="23" fill="#263c38" font-weight="700">还有回合 → 下一回合</text><text x="740" y="536" font-size="18" fill="#50645e" font-weight="400">显示日结与局部回应</text><text x="740" y="562" font-size="18" fill="#50645e" font-weight="400">最后一回合 → 回访与结果</text><path d="M659,522 L716,522" fill="none" stroke="#66887c" stroke-width="3" marker-end="url(#arr)"/><rect x="40" y="467" width="260" height="110" rx="12" fill="#ffffff" stroke="#d7d8d0"/><text x="60" y="503" font-size="23" fill="#263c38" font-weight="700">现金 &lt;0 → 停业</text><text x="60" y="536" font-size="18" fill="#50645e" font-weight="400">解释差额与未完成订单</text><text x="60" y="562" font-size="18" fill="#50645e" font-weight="400">仍可重试或整局重开</text><path d="M359,522 L304,522" fill="none" stroke="#66887c" stroke-width="3" marker-end="url(#arr)"/><rect x="40" y="620" width="1100" height="124" rx="12" fill="#dce7df" stroke="#d7d8d0"/><text x="62" y="656" font-size="24" fill="#263c38" font-weight="700">标准版：重新尝试本回合</text><text x="62" y="690" font-size="20" fill="#50645e" font-weight="400">现金、零件、订单、采购次数、收音机和叙事标记全部回到起点；清空预览。</text><text x="62" y="721" font-size="20" fill="#50645e" font-weight="400">基础供给已经包含在快照中，不重复发放。精简版只保留整局重开。</text><text x="40" y="793" font-size="19" fill="#263c38" font-weight="400">拆取在本次尝试中不可撤销；重新尝试会撤销本次尝试的全部后果。</text><path d="M359,370 L305,370" fill="none" stroke="#66887c" stroke-width="3" marker-end="url(#arr)"/><path d="M1140,522 L1160,522 L1160,102 L170,102 L170,117" fill="none" stroke="#66887c" stroke-width="2" marker-end="url(#arr)"/></g></svg>