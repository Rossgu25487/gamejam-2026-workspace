<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="810" viewBox="0 0 1280 810"><defs><marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6" fill="none" stroke="#66887c" stroke-width="1.4"/></marker></defs><rect width="100%" height="100%" fill="#f6f4ed"/><g font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif"><text x="40" y="51" font-size="30" fill="#263c38" font-weight="700">修补铺｜第二回合的操作信息草图</text><text x="40" y="86" font-size="18" fill="#263c38" font-weight="400">低保真示意 · 当前正在查看钟的订单 · 槽位尚未选件</text><rect x="40" y="110" width="1200" height="66" rx="12" fill="#dce7df" stroke="#d7d8d0"/><text x="62" y="152" font-size="22" fill="#263c38" font-weight="400">回合 02 / 03</text><text x="320" y="152" font-size="22" fill="#263c38" font-weight="400">现金 12</text><text x="540" y="152" font-size="22" fill="#263c38" font-weight="400">今晚开支 8</text><text x="830" y="152" font-size="22" fill="#263c38" font-weight="400">当前预计日结 4</text><rect x="40" y="199" width="270" height="380" rx="12" fill="#ffffff" stroke="#d7d8d0"/><text x="62" y="235" font-size="22" fill="#263c38" font-weight="700">订单｜两单共享库存</text><rect x="60" y="253" width="230" height="123" rx="12" fill="#f6f4ed" stroke="#d7d8d0"/><text x="78" y="284" font-size="20" fill="#50645e" font-weight="400">灯 · 尚未处理</text><text x="78" y="315" font-size="20" fill="#50645e" font-weight="400">需要：线圈 C ×1</text><text x="78" y="346" font-size="20" fill="#50645e" font-weight="400">交付收入：6</text><rect x="60" y="391" width="230" height="163" rx="12" fill="#e2ece4" stroke="#6b8d7f"/><text x="78" y="423" font-size="20" fill="#50645e" font-weight="400">钟 · 当前查看</text><text x="78" y="454" font-size="20" fill="#50645e" font-weight="400">需要：C ×1、G ×1</text><text x="78" y="485" font-size="20" fill="#50645e" font-weight="400">交付收入：9</text><text x="78" y="516" font-size="20" fill="#50645e" font-weight="400">两单合计缺 C ×1</text><rect x="332" y="199" width="524" height="380" rx="12" fill="#e9e3d5" stroke="#d7d8d0"/><text x="355" y="236" font-size="22" fill="#263c38" font-weight="700">工作台｜查看 → 安装 → 交付</text><circle cx="594" cy="337" r="66" fill="#f9f3df" stroke="#6c7770" stroke-width="9"/><path d="M594,291 L594,337 L626,356" fill="none" stroke="#455b53" stroke-width="6"/><text x="476" y="438" font-size="18" fill="#263c38" font-weight="400">配方按类型匹配，顺序不限</text><rect x="413" y="455" width="161" height="58" rx="12" fill="#fcfaf3" stroke="#82998d"/><text x="440" y="493" font-size="19" fill="#263c38" font-weight="400">C 槽｜未选</text><rect x="610" y="455" width="161" height="58" rx="12" fill="#fcfaf3" stroke="#82998d"/><text x="637" y="493" font-size="19" fill="#263c38" font-weight="400">G 槽｜未选</text><text x="404" y="549" font-size="20" fill="#263c38" font-weight="400">未交付前可换件；库存暂不扣除</text><rect x="878" y="199" width="362" height="380" rx="12" fill="#ffffff" stroke="#d7d8d0"/><text x="901" y="237" font-size="22" fill="#263c38" font-weight="700">寄存物｜旧收音机</text><rect x="938" y="260" width="237" height="99" rx="12" fill="#c7ae89" stroke="#806e59"/><circle cx="1130" cy="310" r="23" fill="#e9dcc6" stroke="#806e59" stroke-width="3"/><text x="902" y="397" font-size="19" fill="#50645e" font-weight="400">寄存标签：请留到最后取回</text><text x="902" y="428" font-size="19" fill="#50645e" font-weight="400">拆取可得：线圈 C ×1</text><text x="902" y="459" font-size="19" fill="#50645e" font-weight="400">后果：机芯破坏，本局无法复原</text><rect x="903" y="506" width="311" height="47" rx="12" fill="#eee2d4" stroke="#a98963"/><text x="930" y="537" font-size="20" fill="#263c38" font-weight="400">拆取零件…（需确认）</text><rect x="40" y="600" width="1200" height="134" rx="12" fill="#ffffff" stroke="#d7d8d0"/><text x="63" y="637" font-size="22" fill="#263c38" font-weight="400">库存：线圈 C ×1　齿轮 G ×1</text><text x="63" y="675" font-size="19" fill="#263c38" font-weight="400">点击零件，再点对应槽位；可再次点击取下。</text><text x="63" y="710" font-size="18" fill="#263c38" font-weight="400">采购 C ×1：8 元，本回合限 1 次。</text><rect x="697" y="629" width="231" height="70" rx="12" fill="#e5e5df" stroke="#d7d8d0"/><text x="737" y="657" font-size="18" fill="#263c38" font-weight="400">交付 +9（禁用）</text><text x="735" y="684" font-size="17" fill="#263c38" font-weight="400">尚缺两个配方槽</text><rect x="953" y="629" width="262" height="70" rx="12" fill="#dce7df" stroke="#90aa9a"/><text x="1002" y="672" font-size="22" fill="#263c38" font-weight="400">结束营业…</text><text x="40" y="777" font-size="18" fill="#263c38" font-weight="400">图示只说明信息职责与状态；背景景深、人物和物件细节由美术样例另行确定。</text></g></svg>