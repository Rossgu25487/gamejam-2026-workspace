<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="820"><defs><marker id="a" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0 0 L6 3 L0 6" fill="none" stroke="#6a8b7c"/></marker></defs><rect width="100%" height="100%" fill="#f7f5ed"/><g font-family="Microsoft YaHei,sans-serif"><text x="36" y="48" font-size="30" font-weight="700" fill="#2a4139">用途修补｜最后一段的方案比较</text><text x="36" y="83" font-size="19" font-weight="400" fill="#2a4139">当前委托：公共收音机　　故障：外放模块　　顾客：周姐</text><rect x="36" y="105" width="1210" height="62" rx="10" fill="#dce7dd" stroke="#c7cec6"/><text x="58" y="145" font-size="23" font-weight="700" fill="#2a4139">剩余工作 3 格</text><text x="359" y="145" font-size="23" font-weight="700" fill="#2a4139">替换模块 1 块</text><text x="725" y="145" font-size="21" font-weight="400" fill="#2a4139">检查、阅读、提议方案不扣资源</text><rect x="36" y="190" width="287" height="405" rx="10" fill="#fff" stroke="#c7cec6"/><text x="56" y="228" font-size="23" font-weight="700" fill="#2a4139">今天的两件委托</text><text x="56" y="278" font-size="20" font-weight="400" fill="#2a4139">阿程的闹钟</text><text x="56" y="310" font-size="20" font-weight="400" fill="#2a4139">需要：睡着时能被叫醒</text><text x="56" y="342" font-size="20" font-weight="400" fill="#2a4139">更换模块：1 块 / 1 格</text><text x="56" y="374" font-size="20" font-weight="400" fill="#2a4139">耳机输出：不合用</text><rect x="53" y="414" width="252" height="157" rx="10" fill="#e5ece2" stroke="#c7cec6"/><text x="67" y="448" font-size="19" font-weight="400" fill="#2a4139">周姐的公共收音机</text><text x="67" y="480" font-size="19" font-weight="400" fill="#2a4139">需要：住户收到通知</text><text x="67" y="512" font-size="19" font-weight="400" fill="#2a4139">可原样修好；也可听写</text><text x="67" y="544" font-size="19" font-weight="400" fill="#2a4139">再逐间转告。</text><rect x="344" y="190" width="450" height="405" rx="10" fill="#e8e0d0" stroke="#c7cec6"/><text x="365" y="230" font-size="23" font-weight="700" fill="#2a4139">物件与检查记录</text><rect x="421" y="271" width="301" height="130" rx="10" fill="#bca17e" stroke="#c7cec6"/><circle cx="671" cy="335" r="27" fill="#e7d8b9" stroke="#5e6c5d" stroke-width="4"/><text x="366" y="450" font-size="20" font-weight="400" fill="#2a4139">接点：连接稳定</text><text x="366" y="482" font-size="20" font-weight="400" fill="#2a4139">外放已确认异常，信号仍可收听</text><text x="366" y="514" font-size="20" font-weight="400" fill="#2a4139">本段直接比较用途与方案</text><rect x="815" y="190" width="431" height="405" rx="10" fill="#fff" stroke="#c7cec6"/><text x="836" y="229" font-size="23" font-weight="700" fill="#2a4139">方案比较</text><text x="837" y="275" font-size="20" font-weight="400" fill="#2a4139">更换模块</text><text x="837" y="307" font-size="20" font-weight="400" fill="#2a4139">消耗 1 块模块、1 格工作</text><text x="837" y="339" font-size="20" font-weight="400" fill="#2a4139">保留外放，住户可以共同收听</text><rect x="834" y="359" width="389" height="206" rx="10" fill="#eee7d6" stroke="#c7cec6"/><text x="854" y="393" font-size="19" font-weight="400" fill="#2a4139">改为耳机输出</text><text x="854" y="425" font-size="19" font-weight="400" fill="#2a4139">消耗 0 块模块、2 格工作</text><text x="854" y="457" font-size="19" font-weight="400" fill="#2a4139">失去外放，保留收听</text><text x="854" y="489" font-size="19" font-weight="400" fill="#2a4139">需先问周姐能否听写、转告</text><text x="854" y="521" font-size="19" font-weight="400" fill="#2a4139">她接受以后，才能开始施工。</text><rect x="36" y="619" width="1210" height="124" rx="10" fill="#fff" stroke="#c7cec6"/><text x="58" y="653" font-size="22" font-weight="700" fill="#2a4139">也可以先询问阿程：能否转用他的私人收音机模块？</text><text x="58" y="690" font-size="20" font-weight="400" fill="#2a4139">试过耳机并获得同意后：工作 −1 格，模块 +1 块；私人设备保留耳机收听，失去外放。</text><text x="58" y="722" font-size="18" font-weight="400" fill="#2a4139">未施工方案可更换。第三段重新安排会恢复整段起点。</text><text x="36" y="786" font-size="18" font-weight="400" fill="#2a4139">结构草图；人物、美术和声音尚未接入。方案功能与人物用途应放在同一屏比较。</text></g></svg>