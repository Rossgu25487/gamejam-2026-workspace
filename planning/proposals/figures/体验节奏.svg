<svg xmlns="http://www.w3.org/2000/svg" width="1220" height="770" viewBox="0 0 1220 770"><defs><marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6" fill="none" stroke="#66887c" stroke-width="1.4"/></marker></defs><rect width="100%" height="100%" fill="#f6f4ed"/><g font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif"><text x="40" y="52" font-size="30" fill="#263c38" font-weight="700">体验节奏｜挑战与能力的定性预推演</text><text x="40" y="88" font-size="19" fill="#263c38" font-weight="400">高低为设计假设，不代表心流测量值；时间以真实试玩调整。</text><text x="40" y="154" font-size="22" fill="#263c38" font-weight="700">需要掌握的能力</text><rect x="35" y="180" width="185" height="102" rx="12" fill="#e3eae2" stroke="#d7d8d0"/><text x="50" y="216" font-size="19" fill="#263c38" font-weight="400">找到目标</text><text x="50" y="247" font-size="19" fill="#263c38" font-weight="400">点击安装</text><rect x="275" y="180" width="185" height="102" rx="12" fill="#e3eae2" stroke="#d7d8d0"/><text x="290" y="216" font-size="19" fill="#263c38" font-weight="400">配两种零件</text><text x="290" y="247" font-size="19" fill="#263c38" font-weight="400">理解日结</text><rect x="515" y="180" width="185" height="102" rx="12" fill="#e6e0cc" stroke="#d7d8d0"/><text x="530" y="216" font-size="19" fill="#263c38" font-weight="400">比较两张订单</text><text x="530" y="247" font-size="19" fill="#263c38" font-weight="400">理解采购与拆取</text><rect x="755" y="180" width="185" height="102" rx="12" fill="#e3eae2" stroke="#d7d8d0"/><text x="770" y="216" font-size="19" fill="#263c38" font-weight="400">安排操作先后</text><text x="770" y="247" font-size="19" fill="#263c38" font-weight="400">考虑累积后果</text><rect x="995" y="180" width="185" height="102" rx="12" fill="#e3eae2" stroke="#d7d8d0"/><text x="1010" y="216" font-size="19" fill="#263c38" font-weight="400">回看自己的处理</text><text x="1010" y="247" font-size="19" fill="#263c38" font-weight="400">理解人物回应</text><text x="40" y="336" font-size="21" fill="#263c38" font-weight="700">认知挑战</text><text x="40" y="417" font-size="17" fill="#263c38" font-weight="400">低</text><text x="40" y="367" font-size="17" fill="#263c38" font-weight="400">较高</text><path d="M100,415 L340,395 L580,358 L820,365 L1060,420" fill="none" stroke="#5d8576" stroke-width="5"/><text x="40" y="490" font-size="21" fill="#263c38" font-weight="700">情绪张力</text><path d="M100,570 L340,550 L580,512 L820,517 L1060,520" fill="none" stroke="#b78b4e" stroke-width="5"/><path d="M100,588 L100,598" stroke="#8b968b" stroke-width="2"/><text x="48" y="631" font-size="19" fill="#263c38" font-weight="400">L0 首次修好</text><path d="M340,588 L340,598" stroke="#8b968b" stroke-width="2"/><text x="288" y="631" font-size="19" fill="#263c38" font-weight="400">L1 独立练习</text><path d="M580,588 L580,598" stroke="#8b968b" stroke-width="2"/><text x="528" y="631" font-size="19" fill="#263c38" font-weight="400">L2 订单冲突</text><path d="M820,588 L820,598" stroke="#8b968b" stroke-width="2"/><text x="768" y="631" font-size="19" fill="#263c38" font-weight="400">L3 综合分配</text><path d="M1060,588 L1060,598" stroke="#8b968b" stroke-width="2"/><text x="1008" y="631" font-size="19" fill="#263c38" font-weight="400">回访与收束</text><text x="40" y="692" font-size="20" fill="#50645e" font-weight="400">节奏预期：安全完成 → 掌握同类操作 → 面对资源冲突 → 使用已学规则 → 留出回味。</text><text x="40" y="725" font-size="20" fill="#50645e" font-weight="400">若玩家卡在找按钮或算不清账，先修理解与反馈；不把操作障碍当作挑战。</text></g></svg>