<svg xmlns="http://www.w3.org/2000/svg" width="1288" height="755"><defs><marker id="a" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0 0 L6 3 L0 6" fill="none" stroke="#6a8b7c"/></marker></defs><rect width="100%" height="100%" fill="#f7f5ed"/><g font-family="Microsoft YaHei,sans-serif"><text x="36" y="50" font-size="30" font-weight="700" fill="#2a4139">关卡与学习｜同一套工具逐步解决不同问题</text><text x="36" y="86" font-size="19" font-weight="400" fill="#2a4139">段落时长和难度待首次试玩校准；图中不设置未经测量的心流分数。</text><rect x="36" y="116" width="286" height="553" rx="10" fill="#fff" stroke="#c7cec6"/><text x="52" y="153" font-size="23" font-weight="700" fill="#2a4139">L1 第一次修好</text><text x="52" y="205" font-size="20" font-weight="700" fill="#2a4139">进入时</text><text x="52" y="245" font-size="19" font-weight="400" fill="#2a4139">看懂症状</text><text x="52" y="277" font-size="19" font-weight="400" fill="#2a4139">检查接点与发声</text><text x="52" y="337" font-size="20" font-weight="700" fill="#2a4139">本段要求</text><text x="52" y="377" font-size="19" font-weight="400" fill="#2a4139">把现象联系到部位</text><text x="52" y="409" font-size="19" font-weight="400" fill="#2a4139">完成一件低风险委托</text><text x="52" y="470" font-size="20" font-weight="700" fill="#2a4139">剧情作用</text><text x="52" y="510" font-size="19" font-weight="400" fill="#2a4139">认识物主和使用习惯</text><text x="52" y="542" font-size="19" font-weight="400" fill="#2a4139">留下后来能认出的物件</text><rect x="346" y="116" width="286" height="553" rx="10" fill="#fff" stroke="#c7cec6"/><text x="362" y="153" font-size="23" font-weight="700" fill="#2a4139">L2 辨别故障</text><text x="362" y="205" font-size="20" font-weight="700" fill="#2a4139">进入时</text><text x="362" y="245" font-size="19" font-weight="400" fill="#2a4139">已经会用两个工具</text><text x="362" y="277" font-size="19" font-weight="400" fill="#2a4139">能回看测试记录</text><text x="362" y="337" font-size="20" font-weight="700" fill="#2a4139">本段要求</text><text x="362" y="377" font-size="19" font-weight="400" fill="#2a4139">相似症状，原因改变</text><text x="362" y="409" font-size="19" font-weight="400" fill="#2a4139">排除上一次的修法</text><text x="362" y="470" font-size="20" font-weight="700" fill="#2a4139">剧情作用</text><text x="362" y="510" font-size="19" font-weight="400" fill="#2a4139">认识第二个人</text><text x="362" y="542" font-size="19" font-weight="400" fill="#2a4139">知道之后会缺少配件</text><rect x="656" y="116" width="286" height="553" rx="10" fill="#eee7d6" stroke="#c7cec6"/><text x="672" y="153" font-size="23" font-weight="700" fill="#2a4139">L3 方案与用途</text><text x="672" y="205" font-size="20" font-weight="700" fill="#2a4139">进入时</text><text x="672" y="245" font-size="19" font-weight="400" fill="#2a4139">已理解故障与修法</text><text x="672" y="277" font-size="19" font-weight="400" fill="#2a4139">无需重新学操作</text><text x="672" y="337" font-size="20" font-weight="700" fill="#2a4139">本段要求</text><text x="672" y="377" font-size="19" font-weight="400" fill="#2a4139">同一修法是否合用</text><text x="672" y="409" font-size="19" font-weight="400" fill="#2a4139">共享模块与工作格</text><text x="672" y="470" font-size="20" font-weight="700" fill="#2a4139">剧情作用</text><text x="672" y="510" font-size="19" font-weight="400" fill="#2a4139">两人都提出办法</text><text x="672" y="542" font-size="19" font-weight="400" fill="#2a4139">后果由实际功能体现</text><rect x="966" y="116" width="286" height="553" rx="10" fill="#fff" stroke="#c7cec6"/><text x="982" y="153" font-size="23" font-weight="700" fill="#2a4139">回访与结束</text><text x="982" y="205" font-size="20" font-weight="700" fill="#2a4139">进入时</text><text x="982" y="245" font-size="19" font-weight="400" fill="#2a4139">关键决定已经完成</text><text x="982" y="277" font-size="19" font-weight="400" fill="#2a4139">不再增加新规则</text><text x="982" y="337" font-size="20" font-weight="700" fill="#2a4139">本段要求</text><text x="982" y="377" font-size="19" font-weight="400" fill="#2a4139">看到设备如何被使用</text><text x="982" y="409" font-size="19" font-weight="400" fill="#2a4139">回顾未解决的需要</text><text x="982" y="470" font-size="20" font-weight="700" fill="#2a4139">剧情作用</text><text x="982" y="510" font-size="19" font-weight="400" fill="#2a4139">回应当前这次处理</text><text x="982" y="542" font-size="19" font-weight="400" fill="#2a4139">允许停下来回味</text><text x="36" y="716" font-size="20" font-weight="400" fill="#2a4139">观察重点：会不会解释判断，是否只在重复点击，人物用途有没有改变方案。</text></g></svg>